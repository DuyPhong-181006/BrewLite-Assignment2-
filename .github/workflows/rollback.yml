# TV1 – Rollback thủ công: Actions -> Rollback -> Run workflow -> nhập commit SHA của bản tốt trước đó.
# AWS EC2 (production chính): SSH vào server chạy deploy/deploy.sh <sha> -> kéo lại image API + web :<sha> từ GHCR.
# Render (bản phụ): chạy lại image ghcr.io/<owner>/brewlite-api:<sha>. Vercel (bản phụ): đưa bản production trước lên lại.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA của bản muốn quay về (xem lần chạy CD xanh trước đó trong tab Actions)'
        required: true
      web:
        description: 'Rollback cả web trên Vercel (bản phụ)?'
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  rollback-ec2:
    if: ${{ vars.EC2_HOST != '' }}
    runs-on: ubuntu-latest
    environment: production-aws
    env:
      SHA: ${{ inputs.sha }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_URL: ${{ vars.EC2_URL }}
      SSH_TARGET: ${{ vars.EC2_USER || 'ubuntu' }}@${{ vars.EC2_HOST }}
      APP_DIR: ${{ vars.EC2_APP_DIR || 'brewlite' }}
    steps:
      - name: Chuẩn bị khóa SSH
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2> /dev/null
      - name: Chạy lại bản cũ trên server
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2.pem "$SSH_TARGET" "docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null \
            && bash $APP_DIR/deploy/deploy.sh $SHA; rc=\$?; docker logout ghcr.io > /dev/null; exit \$rc"
      - name: Kiểm tra /api/health trả đúng phiên bản
        run: |
          for i in $(seq 1 30); do
            v=$(curl -fsS --max-time 20 "$EC2_URL/api/health" | jq -r '.version // empty' || true)
            if [ "$v" = "$SHA" ]; then echo "Đã quay về $SHA"; exit 0; fi
            echo "Lần $i: đang chạy '$v', chờ 10s..."; sleep 10
          done
          exit 1

  rollback-api:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ vars.API_URL }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Deploy lại image cũ
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brewlite-api:$SHA"
          img=$(jq -rn --arg v "$image" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${img}" > /dev/null
          echo "Đã yêu cầu Render chạy $image"
      - name: Kiểm tra /health trả đúng phiên bản
        run: |
          for i in $(seq 1 40); do
            v=$(curl -fsS --max-time 20 "$API_URL/health" | jq -r '.version // empty' || true)
            if [ "$v" = "$SHA" ]; then echo "Đã quay về $SHA"; exit 0; fi
            echo "Lần $i: đang chạy '$v', chờ 15s..."; sleep 15
          done
          exit 1

  rollback-web:
    if: ${{ inputs.web && vars.WEB_URL != '' }}
    runs-on: ubuntu-latest
    environment: production-web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vercel rollback về bản production trước
        run: npx --yes vercel@latest rollback --token="${{ secrets.VERCEL_TOKEN }}"
